<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request could not be processed — EnPlace Pro</title>
    <style>
      :root { --green: #3A6147; --green-light: #4A7C59; --cream: #FAF7F2; --navy: #2D3436; --orange: #D4943A; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; background: var(--cream); color: var(--navy);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%; max-width: 26rem; background: #fff; border: 1px solid #E7E2DA;
        border-radius: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; text-align: center;
      }
      .bar { height: .5rem; background: var(--green); }
      .body { padding: 2rem 1.5rem; }
      .logo { font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; margin: 0 0 1.5rem; }
      .logo span { color: var(--orange); }
      h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
      p { font-size: .9rem; line-height: 1.5; color: #5F6A6C; margin: 0 0 1.5rem; }
      a.cta {
        display: block; background: var(--green); color: #fff; text-decoration: none;
        font-weight: 600; font-size: .95rem; padding: .85rem 1rem; border-radius: .65rem;
      }
      a.cta:active { background: var(--green-light); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bar"></div>
      <div class="body">
        <p class="logo">EnPlace<span>Pro</span></p>
        <h1>That request couldn&rsquo;t be processed</h1>
        <p>The page may have expired while it sat open. Please reload and try again.</p>
        <a class="cta" href="/">Back to my dashboard</a>
      </div>
    </div>
  </body>
</html>
